name: Build and publish releases

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'proxy/**'
      - 'antlr/**'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'LICENSE'
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

jobs:
  build_and_publish:
    name: Build and publish docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v2
      - name: Setup version information
        id: version
        run: |
          chmod +x scripts/version.sh
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            export ZDM_VERSION="${{ github.ref_name }}"
            export ZDM_VERSION_TYPE="release"
          else
            export ZDM_VERSION_TYPE="dev"
          fi

          # Extract version components
          VERSION=$(./scripts/version.sh version)
          GIT_HASH=$(git rev-parse --short=7 HEAD)

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_TYPE=${ZDM_VERSION_TYPE:-dev}" >> $GITHUB_OUTPUT
          echo "GIT_HASH=$GIT_HASH" >> $GITHUB_OUTPUT
      # Setup metadata based on the commit/tag that will be used for tagging the image
      - name: Setup Docker meta
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: |
            datastax/zdm-proxy
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}.x
            type=semver,pattern={{major}}.x
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          file: Dockerfile
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            VERSION_TYPE=${{ steps.version.outputs.VERSION_TYPE }}
            GIT_HASH=${{ steps.version.outputs.GIT_HASH }}
