name: Release Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

jobs:
  build:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest
    container: golang:1.24.2-bullseye
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        # workaround for issue: https://github.com/docker-library/golang/issues/452#issuecomment-1418939909
      - name: Set workspace as safe
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Setup version information
        run: |
          chmod +x scripts/version.sh
          echo "Setting up version information for tag: ${{ github.ref_name }}"
          export ZDM_VERSION="${{ github.ref_name }}"
          export ZDM_VERSION_TYPE="release"
          echo "VERSION_INFO<<EOF" >> $GITHUB_ENV
          ./scripts/version.sh all >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Build Linux/amd64 binary
        run: |
          export GO111MODULE=on
          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH=amd64
          export ZDM_VERSION="${{ github.ref_name }}"
          export ZDM_VERSION_TYPE="release"
          BINARY_NAME=$(./scripts/version.sh binary-name)
          LDFLAGS=$(./scripts/version.sh ldflags)
          echo "Building binary: $BINARY_NAME"
          go build -ldflags "$LDFLAGS" -o "$BINARY_NAME" ./proxy
          tar cvfz "${BINARY_NAME}.tgz" "$BINARY_NAME" LICENSE
      - name: Build Windows/amd64 binary
        run: |
          apt update
          apt -y install zip
          export GO111MODULE=on
          export CGO_ENABLED=0
          export GOOS=windows
          export GOARCH=amd64
          export ZDM_VERSION="${{ github.ref_name }}"
          export ZDM_VERSION_TYPE="release"
          BINARY_NAME=$(./scripts/version.sh binary-name)
          LDFLAGS=$(./scripts/version.sh ldflags)
          echo "Building binary: ${BINARY_NAME}.exe"
          go build -ldflags "$LDFLAGS" -o "${BINARY_NAME}.exe" ./proxy
          zip -vr "${BINARY_NAME}.zip" "${BINARY_NAME}.exe" LICENSE
      - name: Build Darwin/amd64 binary
        run: |
          export GO111MODULE=on
          export CGO_ENABLED=0
          export GOOS=darwin
          export GOARCH=amd64
          export ZDM_VERSION="${{ github.ref_name }}"
          export ZDM_VERSION_TYPE="release"
          BINARY_NAME=$(./scripts/version.sh binary-name)
          LDFLAGS=$(./scripts/version.sh ldflags)
          echo "Building binary: $BINARY_NAME"
          go build -ldflags "$LDFLAGS" -o "$BINARY_NAME" ./proxy
          tar cvfz "${BINARY_NAME}.tgz" "$BINARY_NAME" LICENSE
      - name: Build Darwin/arm64 binary
        run: |
          export GO111MODULE=on
          export CGO_ENABLED=0
          export GOOS=darwin
          export GOARCH=arm64
          export ZDM_VERSION="${{ github.ref_name }}"
          export ZDM_VERSION_TYPE="release"
          BINARY_NAME=$(./scripts/version.sh binary-name)
          LDFLAGS=$(./scripts/version.sh ldflags)
          echo "Building binary: $BINARY_NAME"
          go build -ldflags "$LDFLAGS" -o "$BINARY_NAME" ./proxy
          tar cvfz "${BINARY_NAME}.tgz" "$BINARY_NAME" LICENSE
      - name: Build Linux/arm64 binary
        run: |
          export GO111MODULE=on
          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH=arm64
          export ZDM_VERSION="${{ github.ref_name }}"
          export ZDM_VERSION_TYPE="release"
          BINARY_NAME=$(./scripts/version.sh binary-name)
          LDFLAGS=$(./scripts/version.sh ldflags)
          echo "Building binary: $BINARY_NAME"
          go build -ldflags "$LDFLAGS" -o "$BINARY_NAME" ./proxy
          tar cvfz "${BINARY_NAME}.tgz" "$BINARY_NAME" LICENSE
      - name: Generate Checksums
        run: |
          export ZDM_VERSION="${{ github.ref_name }}"
          export ZDM_VERSION_TYPE="release"

          # Generate checksums for all built archives
          for archive in *.tgz *.zip; do
            if [ -f "$archive" ]; then
              sha256sum "$archive" | cut -d ' ' -f 1 > "${archive%.*}-sha256.txt"
              echo "Generated checksum for: $archive"
            fi
          done
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ZDM Proxy ${{ github.ref_name }}
          files: |
            *.tgz
            *.zip
            *-sha256.txt
